name: Human Ontology CI

on:
  push:
    paths:
      - "ontology/**"
      - "core/**"
      - "scripts/validate_human_ontology.py"
      - "scripts/validate_human_ontology_v2.py"
      - "scripts/test_persona_kernel_compat.py"
      - "scripts/test_persona_kernel_contract.py"
      - "scripts/test_events_sampling.py"
      - "scripts/test_ontology_json_assets.py"
      - "scripts/check_ontology_release_gate.py"
      - ".github/workflows/ontology-ci.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "core/**"
      - "scripts/validate_human_ontology.py"
      - "scripts/validate_human_ontology_v2.py"
      - "scripts/test_persona_kernel_compat.py"
      - "scripts/test_persona_kernel_contract.py"
      - "scripts/test_events_sampling.py"
      - "scripts/test_ontology_json_assets.py"
      - "scripts/check_ontology_release_gate.py"
      - ".github/workflows/ontology-ci.yml"

jobs:
  json-assets:
    name: JSON assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/test_ontology_json_assets.py

  validate-v1:
    name: Validate v1 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_human_ontology.py

  validate-v2:
    name: Validate v2 ontology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_human_ontology_v2.py

  runtime:
    name: Compile + Kernel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile core/*.py
      - name: Persona Kernel metadata smoke
        run: |
          python - <<'PY'
          from core.persona_kernel import PersonaKernel, FieldMetadata
          p = PersonaKernel("ci-person")
          p.set_value(
              "current_state",
              "mood",
              "neutral",
              FieldMetadata("generated", 0.5, "ci-smoke", "dynamic_state"),
          )
          assert p.get_value("current_state", "mood") == "neutral"
          assert p.to_dict()["ontology_version"] == "2.0.0-rc2"
          print("Persona Kernel smoke test: OK")
          PY

  compatibility:
    name: Legacy compatibility + semantic firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/test_persona_kernel_compat.py

  kernel-contract:
    name: PersonaKernel contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/test_persona_kernel_contract.py

  event-regression:
    name: Event sampling regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/test_events_sampling.py

  release-gate:
    name: Repository release gate
    runs-on: ubuntu-latest
    needs:
      - json-assets
      - validate-v1
      - validate-v2
      - runtime
      - compatibility
      - kernel-contract
      - event-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_ontology_release_gate.py
