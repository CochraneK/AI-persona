# Deploy the static web/ folder (index + table + dashboard + pool.json)
# to GitHub Pages via the Actions "pages" site source.
# Site root = web/  ->  https://cochranek.github.io/AI-persona/
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "scripts/make_full_pool.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
